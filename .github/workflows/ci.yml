name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  # ── 1. Selector package must pass its own tests before anything else ──────
  selector-tests:
    name: Selector Package Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Run selector unit tests
        run: pytest tests/test_selector/ -v --tb=short

  # ── 2. Decide which tests to run based on changed files ───────────────────
  smart-select:
    name: Smart Test Selection
    runs-on: ubuntu-latest
    needs: [selector-tests]
    outputs:
      tags: ${{ steps.select.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git diff works on any branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install selector package
        run: pip install -e .

      - name: Resolve changed files
        id: changed
        run: |
          # On a PR use the merge base; on a direct push use the previous commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          FILES=$(git diff --name-only "$BASE" HEAD | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed: $FILES"

      - name: Select tests
        id: select
        run: |
          TAGS=$(test-selector \
            --changed-files "${{ steps.changed.outputs.files }}" \
            --config config/test_selection_map.yaml \
            --explain)
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  # ── 3. Run only the selected tests (fast feedback loop) ───────────────────
  selective-behave:
    name: "Selected Tests: ${{ needs.smart-select.outputs.tags }}"
    runs-on: ubuntu-latest
    needs: [smart-select]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r app/requirements.txt -e .

      - name: Set run metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "LOG_FILE=tests/selective_run_log.jsonl" >> $GITHUB_ENV

      - name: Run selected tests
        run: behave features/ --tags="${{ needs.smart-select.outputs.tags }}" --no-capture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-run-log
          path: tests/selective_run_log.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-tags
          path: selected_tags.txt

  # ── 4. Full regression — always on main, optional on branches ─────────────
  full-regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    # Always run on main; on feature branches only after selective tests pass.
    if: github.ref == 'refs/heads/main' || needs.selective-behave.result == 'success'
    needs: [selective-behave]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r app/requirements.txt -e .

      - name: Set run metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "LOG_FILE=tests/test_run_log.jsonl" >> $GITHUB_ENV

      - run: behave features/ --no-capture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-run-log
          path: tests/test_run_log.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behave-report
          path: reports/behave_report.txt

  # ── 5. Smoke-only gate (parallel to full regression, always runs) ─────────
  smoke-only:
    name: Smoke Tests Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r app/requirements.txt

      - name: Set run metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "LOG_FILE=tests/smoke_run_log.jsonl" >> $GITHUB_ENV

      - run: behave features/ --tags=@smoke --no-capture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-run-log
          path: tests/smoke_run_log.jsonl
