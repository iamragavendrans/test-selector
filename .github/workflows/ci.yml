name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  full-regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/requirements.txt
      - name: Set git metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "GIT_CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo '')" >> $GITHUB_ENV
      - run: behave features/ --no-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-run-log
          path: tests/test_run_log.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behave-report
          path: reports/behave_report.txt

  smoke-only:
    name: Smoke Tests Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/requirements.txt
      - name: Set git metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "GIT_CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo '')" >> $GITHUB_ENV
          echo "LOG_FILE=tests/smoke_run_log.jsonl" >> $GITHUB_ENV
      - run: behave features/ --tags=@smoke --no-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-run-log
          path: tests/smoke_run_log.jsonl

  selective-test-demo:
    name: Simulated ML-Selected Tests
    runs-on: ubuntu-latest
    needs: [full-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: full-test-run-log
          path: tests
      - name: Set git metadata
        run: |
          echo "GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "GIT_CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo '')" >> $GITHUB_ENV
          echo "LOG_FILE=tests/selective_run_log.jsonl" >> $GITHUB_ENV
      - run: python scripts/simulate_ml_selection.py
      - run: behave features/ --tags="$(cat selected_tags.txt)" --no-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-tags
          path: selected_tags.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-run-log
          path: tests/selective_run_log.jsonl
