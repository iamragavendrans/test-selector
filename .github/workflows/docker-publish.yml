name: Publish OCI image

# Push to main  → ghcr.io/…/test-selector:latest
# Push vX.Y.Z   → ghcr.io/…/test-selector:X.Y.Z  +  :X.Y  +  :latest
# Pull-request  → build only (no push), validates the Dockerfile
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Build for both amd64 (standard CI runners) and arm64 (M-series Macs,
      # AWS Graviton, etc.) so teams on any architecture can pull the image.
      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates image tags automatically:
      #   semver tag  → :1.2.3, :1.2, :latest
      #   main branch → :latest
      #   PR          → :pr-42 (build-only, not pushed)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=test-selector
            org.opencontainers.image.description=Intelligent test selector — picks which tests to run based on changed files

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching speeds up rebuilds when only pyproject.toml / source changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
